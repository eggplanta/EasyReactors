[project]
name = "easyreactors"
version = "0.2.0"
description = "Chemical reactor design and simulation toolkit: batch, CSTR, PFR and PBR networks with energy balance, pressure drop and mass transfer."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Dspavier", email = "danspavier@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chemicals>=1.5.2",
    "numpy>=2.5.4",
    "pint>=0.26.2",
    "plotext>=6.1.0",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "textual>=8.2.8",
    "thermo>=0.6.1",
]

[project.scripts]
easyreactors = "easyreactors.tui.app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
